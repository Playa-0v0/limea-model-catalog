name: CI

on:
  push:
    branches: [master]
  pull_request: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 全部离线运行，读的是仓库里已提交的快照
      - run: npm run validate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
